name: MedBridge Phase 3 frontend checks
on:
  push:
    branches: ['feature/phase-3-*', 'feature/phase-4-*', 'feature/phase-5-*']
    paths:
      - 'MedBridge-Phase-1/medbridge/frontend/**'
      - '.github/workflows/medbridge-frontend-ci.yml'
  pull_request:
    paths:
      - 'MedBridge-Phase-1/medbridge/frontend/**'
      - '.github/workflows/medbridge-frontend-ci.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MedBridge-Phase-1/medbridge/frontend
    env:
      VITE_ENABLE_AUTH_SUBMISSIONS: 'false'
      VITE_ENABLE_DEMO_WORKFLOWS: 'false'
      VITE_ENABLE_REVIEW: 'false'
      VITE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Offline safety checks
        run: npm run test:safety
      - name: Component and API integration tests (mocked)
        run: npm test
      - name: Build preview assets
        run: npm run build
