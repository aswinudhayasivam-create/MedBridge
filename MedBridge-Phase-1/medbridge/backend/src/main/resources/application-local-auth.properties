server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:mysql://127.0.0.1:13306/medbridge_phase4_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${PHASE4_DB_USERNAME}
spring.datasource.password=${PHASE4_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=optional:classpath:local-auth-no-seed.sql
spring.sql.init.continue-on-error=false
app.jwt.secret=${PHASE4_JWT_SECRET}
app.frontend-url=http://127.0.0.1:5173,http://localhost:5173
app.allow-registration=${APP_ALLOW_REGISTRATION:false}
